name: CI

on:
  push:
    branches: [master]
    tags: ["v*", "20*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      # The size-optimized release profile is slow; build it for pushes only.
      - name: Release build
        if: github.event_name != 'pull_request'
        run: cargo build --release --locked
      - name: Package
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/yt-dlp-gui.exe dist/
          Compress-Archive -Path extension/chromium/* -DestinationPath dist/yt-dlp-gui-extension-chromium.zip
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: yt-dlp-gui-windows
          path: dist/
          if-no-files-found: error

  linux:
    name: Linux compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev pkg-config
      - name: Check
        run: cargo check --locked --all-targets

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yt-dlp-gui-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
