[package]
name = "yt-dlp-gui-v2"
edition = "2024"
authors = ["かんなぎ (Kannagi) / Shirase Hiyori"]
description = "Rust and egui rewrite of a portable GUI for yt-dlp."
readme = ".github/README.md"
license = "MIT"
publish = false

[[bin]]
name = "yt-dlp-gui"
path = "src/main.rs"

[dependencies]
arboard = "3.6.1"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
egui_extras = { version = "0.36.2", default-features = false, features = ["image", "svg", "webp"] }
egui_taffy = "0.14.0"
cpal = "0.18.2"
image = { version = "0.25.10", default-features = false, features = ["ico", "jpeg", "png", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy", "socks", "json"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sqids = "0.4"
getrandom = "0.4.3"
pollster = "1.0.1"
pcre2 = "0.2.11"
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "isomp4", "mkv", "ogg", "vorbis", "mp3", "flac", "pcm"] }
symphonia-adapter-libopus = { version = "0.3.0", features = ["bundled"] }
timestretch = "0.15.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }


[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[build-dependencies]
naga = { version = "30.0.1", features = ["glsl-in", "wgsl-in", "wgsl-out"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6.2"
winreg = "0.56.0"
win32_notif = { version = "0.15.3", features = ["registration"] }
windows = { version = "0.62.2", features = ["Foundation", "Media", "Storage_Streams", "Win32_Foundation", "Win32_Storage", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"
